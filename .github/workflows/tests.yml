name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pytest pytest-html
      - run: pytest tests/ -v --html=reports/test-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
          retention-days: 30
